      <circle cx="762" cy="172" r="5"/>
      <circle cx="828" cy="133" r="5"/>
      <circle cx="882" cy="133" r="4"/>
    </g>
    <circle cx="828" cy="133" r="12" fill="none" stroke="#00D9FF" opacity=".28"/>
    <path d="M48 80V242" stroke="#273740"/>
    <path d="M48 117V169" stroke="#00FF9C" stroke-width="2"/>
    <circle cx="48" cy="31" r="5" fill="#00FF9C"/>
