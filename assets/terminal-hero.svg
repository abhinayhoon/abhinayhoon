<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 324" width="960" height="324" role="img" aria-labelledby="title desc">
  <title id="title">Abhinay // System Online</title>
  <desc id="desc">An obsidian terminal banner with a green status line and a cyan trace connecting four nodes on a grid.</desc>
  <defs>
